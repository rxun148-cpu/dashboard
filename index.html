<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Tables & Reports</title>
<style>
:root{box-sizing:border-box;--bg:#fff;--side:#f7f7f8;--bd:#e2e2e5;--tx:#222;--mut:#666;--card:#f9f9fa;--pri:#6b4fa0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1f;--side:#232327;--bd:#38383d;--tx:#e8e8ea;--mut:#9a9aa0;--card:#26262a}}
:root[data-theme="dark"]{--bg:#1c1c1f;--side:#232327;--bd:#38383d;--tx:#e8e8ea;--mut:#9a9aa0;--card:#26262a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:12px/1.3 "Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
#top{height:34px;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:10px;flex:none}
#top b{font-size:13px}.sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:3px;padding:5px 12px;font-weight:600}
.btn.g{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.d{background:#c0392b}
#main{flex:1;display:flex;min-height:0}
#side{width:225px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column}
#sh{display:flex;align-items:center;height:34px;border-bottom:1px solid var(--bd)}
#sh input{flex:1;min-width:0;border:0;background:none;color:var(--tx);padding:0 8px;font:inherit;font-size:13px;outline:0;height:100%}
.ib{width:30px;height:100%;border:0;border-left:1px solid var(--bd);background:none;display:grid;place-items:center;color:var(--mut)}
.ib.on{color:#e0a800}.ib svg{width:15px;height:15px}
#tree{flex:1;overflow-y:auto;padding:6px 6px 20px}
.fold{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;padding:4px 2px;cursor:pointer;user-select:none}
.fold i{width:11px;height:11px;border:1px solid var(--mut);font:normal 10px/9px monospace;text-align:center;color:var(--mut)}
.it{display:flex;align-items:center;gap:6px;padding:5px 4px 5px 22px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it:hover{background:rgba(120,120,140,.15)}.it span{overflow:hidden;text-overflow:ellipsis}.it svg{flex:none}
#cont{flex:1;overflow:auto;padding:0 10px 30px}
#bar{display:flex;align-items:center;gap:6px;height:30px;font-weight:700;position:sticky;top:0;background:var(--bg);z-index:2}
#bar input{accent-color:var(--pri)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{position:relative;height:195px;border:1px solid var(--bd);background:var(--card);border-radius:3px;cursor:pointer;padding:8px 10px}
.card:hover{border-color:var(--pri)}
.ct{font-size:12.5px;font-weight:500;padding-right:48px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{font-size:9.5px;color:var(--mut);margin-top:1px}
.ci{position:absolute;left:0;right:0;top:78px;display:grid;place-items:center}
.ca{position:absolute;right:6px;top:6px;display:flex;gap:6px}
.ca button{background:none;border:0;padding:0 2px;color:var(--mut);font-size:15px;line-height:1}
.ca .st.on{color:#e0a800}
#menu{position:fixed;z-index:20;background:var(--bg);border:1px solid var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.2);border-radius:3px;min-width:120px;display:none}
#menu div{padding:7px 12px;cursor:pointer}#menu div:hover{background:var(--side)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:30;padding:10px}
.mask.on{display:grid}
.dlg{background:var(--bg);border:1px solid var(--bd);border-radius:4px;width:min(520px,100%);max-height:90%;overflow:auto;padding:16px}
.dlg.w{width:min(900px,100%)}
.dlg h3{margin:0 0 12px;font-size:15px}
.dlg label{display:block;margin:8px 0 3px;font-weight:600}
.dlg input[type=text],.dlg select,.dlg textarea{width:100%;padding:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:3px;font:inherit}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.pv{overflow:auto;max-height:340px;border:1px solid var(--bd);margin-top:8px}
.pv table{border-collapse:collapse;font-size:11px}.pv td,.pv th{border:1px solid var(--bd);padding:3px 6px;white-space:nowrap}
.empty{color:var(--mut);padding:30px;text-align:center;grid-column:1/-1}
@media(max-width:640px){#side{width:150px}}
</style></head><body>
<div id="top"><b>Live Tables &amp; Reports</b><span class="sp"></span><button class="btn" id="add">+ Add Report</button></div>
<div id="main">
 <div id="side">
  <div id="sh"><input id="q" type="text" placeholder="Search" autocomplete="off">
   <button class="ib" id="bq" title="Search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l4.5 4.5"/></svg></button>
   <button class="ib" id="bf" title="Favorites"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 1.5l1.9 4.1 4.4.5-3.3 3 .9 4.4L8 11.3 4.1 13.5 5 9.1 1.7 6.1l4.4-.5z"/></svg></button>
   <button class="ib" id="bc" title="Show all"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 3h4l1.5 2H14v8H2z"/></svg></button></div>
  <div id="tree"></div>
 </div>
 <div id="cont"><div id="bar"><input type="checkbox" id="ea" checked title="Expand / Collapse All"> <span>Expand / Collapse All</span></div><div id="grid"></div></div>
</div>
<div id="menu"></div>
<div class="mask" id="m1"><div class="dlg"><h3 id="ft">Add Report</h3>
 <label>Report Name</label><input type="text" id="fn">
 <label>Category</label><input type="text" id="fc" list="cats" value="Live Tables &amp; Reports"><datalist id="cats"></datalist>
 <label>Description</label><textarea id="fd" rows="2"></textarea>
 <label>Report Type</label><select id="fy"><option>Table</option><option>Report</option><option>Chart</option></select>
 <label>File (CSV / XLSX)</label><input type="file" id="ff" accept=".csv,.xlsx,.xls,.txt,.json,.pdf"><div id="fcur" style="color:var(--mut);margin-top:3px"></div>
 <div class="row"><button class="btn g" id="fx">Cancel</button><button class="btn" id="fs">Save</button></div></div></div>
<div class="mask" id="m2"><div class="dlg w"><h3 id="vt"></h3><div id="vi" style="color:var(--mut)"></div><div class="pv" id="vp"></div>
 <div class="row"><button class="btn g" id="vd">Download</button><button class="btn g" id="ve">Edit</button><button class="btn d" id="vx">Delete</button><button class="btn" id="vc">Close</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id),DEF="Live Tables & Reports";
// ---------- IndexedDB ----------
let db;const mem=[];
function open(){return new Promise(r=>{try{const q=indexedDB.open("zreports",1);
 q.onupgradeneeded=()=>{q.result.createObjectStore("reports",{keyPath:"id",autoIncrement:true});q.result.createObjectStore("meta")};
 q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
const tx=(m,f)=>new Promise(r=>{if(!db)return r(null);const t=db.transaction(["reports","meta"],m);let v;f(t.objectStore("reports"),t.objectStore("meta"),x=>v=x);t.oncomplete=()=>r(v);t.onerror=()=>r(null)});
const all=()=>tx("readonly",(s,_,o)=>{s.getAll().onsuccess=e=>o(e.target.result)}).then(x=>x||mem);
const put=r=>tx("readwrite",(s,_,o)=>{s.put(r).onsuccess=e=>o(e.target.result)});
const del=id=>tx("readwrite",s=>s.delete(id));
async function seed(){const done=await tx("readonly",(_,m,o)=>{m.get("seeded").onsuccess=e=>o(e.target.result)});if(done)return;
 const H=36e5,D=24*H,n=Date.now();
 const S=[["Police Verification + Attestation Status","Table",1*H],["EME/EMB Status","Table",3*D],["Parade State","Table",2*D],["Skill Mapping","Table",2*D],["Honours, Awards & Medals","Table",5*D],["Long Roll","Table",4*D],["Waiver/Exemption Status","Table",Date.parse("2026-08-22")?n-Date.parse("2026-08-22")>0?n-Date.parse("2026-08-22"):D:D],["HEQ REPORT","Table",6*D],["Health State","Table",3*D],["PTO Status","Table",4*D],["Assessment Status","Table",5*D],["Discipline State","Table",2*D],["Merit Nominal Roll","Table",7*D],["Selection Roll Status","Table",2*D],["police_verification_attestation_status","Report",1*H],["Service Particulars","Report",1*H],["skill mapping status","Report",1*H],["Waiver Status","Report",1*H]];
 for(const s of S)await put({name:s[0],category:DEF,desc:"",type:s[1],fav:false,modified:n-s[2],fileName:"",file:null});
 await tx("readwrite",(_,m)=>m.put(1,"seeded"))}
// ---------- UI ----------
const SQ='<svg width="WW" height="WW" viewBox="0 0 40 40"><rect x="3" y="3" width="15" height="15" rx="2" fill="#fff" stroke="#444" stroke-width="2"/><rect x="22" y="3" width="15" height="15" rx="2" fill="#d9776b" stroke="#444" stroke-width="2"/><rect x="3" y="22" width="15" height="15" rx="2" fill="#2fa84f" stroke="#444" stroke-width="2"/><rect x="22" y="22" width="15" height="15" rx="2" fill="#e0b85c" stroke="#444" stroke-width="2"/></svg>';
const QI='<svg width="WW" height="WW" viewBox="0 0 48 48"><circle cx="24" cy="24" r="16" fill="#c9a9d6" stroke="#5b3d73" stroke-width="5"/><circle cx="24" cy="24" r="8" fill="#fff" stroke="#5b3d73" stroke-width="4"/><path d="M28 28l9 9" stroke="#5b3d73" stroke-width="4" stroke-linecap="round"/></svg>';
const icon=(r,w)=>(r.type==="Table"?SQ:QI).replace(/WW/g,w);
const MIN=2,fav={};let R=[],edit=null,cur=null,onlyFav=false;
function ago(t){const d=Date.now()-t,m=d/6e4;if(m<2)return"just now";if(m<60)return Math.floor(m)+" min ago";const h=m/60;if(h<24)return Math.floor(h)+" hr ago";const dd=h/24;if(dd<7)return Math.floor(dd)+" days ago";return new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function vis(){const s=$("q").value.trim().toLowerCase();return R.filter(r=>(!onlyFav||r.fav)&&(!s||(r.name+" "+r.category+" "+r.desc+" "+r.fileName).toLowerCase().includes(s))).sort((a,b)=>b.modified-a.modified)}
function render(){const L=vis();
 const cats=[...new Set(R.map(r=>r.category))];$("cats").replaceChildren(...cats.map(c=>{const o=mk("option");o.value=c;return o}));
 const tr=$("tree");tr.replaceChildren();
 const groups={};L.slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:"base"})).forEach(r=>(groups[r.category]=groups[r.category]||[]).push(r));
 Object.keys(groups).sort((a,b)=>a===DEF?-1:b===DEF?1:a.localeCompare(b)).forEach(c=>{
  const f=mk("div","fold"),i=mk("i",0,sideOpen[c]===false?"+":"−");f.append(i,mk("span",0,"▢ "+c));
  const box=mk("div");box.style.display=sideOpen[c]===false?"none":"block";
  f.onclick=()=>{sideOpen[c]=sideOpen[c]===false;render()};
  groups[c].forEach(r=>{const d=mk("div","it");d.title=r.name;d.insertAdjacentHTML("beforeend",icon(r,16));d.append(mk("span",0,r.name));d.onclick=()=>view(r.id);box.append(d)});
  tr.append(f,box)});
 const g=$("grid");g.replaceChildren();
 if(!L.length)g.append(mk("div","empty",R.length?"No reports match.":"No reports yet. Click + Add Report."));
 L.forEach(r=>{const c=mk("div","card");c.append(mk("div","ct",r.name),mk("div","cm","Last modified "+ago(r.modified)));
  const ci=mk("div","ci");ci.innerHTML=icon(r,42);c.append(ci);
  const a=mk("div","ca"),s=mk("button","st"+(r.fav?" on":""),r.fav?"★":"☆"),m=mk("button",0,"⋮");s.title="Favorite";
  s.onclick=async e=>{e.stopPropagation();r.fav=!r.fav;await put(r);render()};
  m.onclick=e=>{e.stopPropagation();menu(e,r)};a.append(s,m);c.append(a);c.onclick=()=>view(r.id);g.append(c)});
 $("bf").classList.toggle("on",onlyFav)}
const sideOpen={};
async function load(){R=await all();render()}
function menu(e,r){const M=$("menu");M.replaceChildren();
 [["Open",()=>view(r.id)],["Edit",()=>form(r)],["Download",()=>dl(r)],["Delete",()=>rm(r)]].forEach(([t,f])=>{const d=mk("div",0,t);d.onclick=()=>{M.style.display="none";f()};M.append(d)});
 M.style.display="block";const w=M.offsetWidth,h=M.offsetHeight;M.style.left=Math.min(e.clientX,innerWidth-w-6)+"px";M.style.top=Math.min(e.clientY,innerHeight-h-6)+"px"}
document.addEventListener("click",()=>$("menu").style.display="none");
// form
function form(r){edit=r||null;$("m2").classList.remove("on");$("ft").textContent=r?"Edit Report":"Add Report";
 $("fn").value=r?r.name:"";$("fc").value=r?r.category:DEF;$("fd").value=r?r.desc:"";$("fy").value=r?r.type:"Table";$("ff").value="";
 $("fcur").textContent=r&&r.fileName?"Current file: "+r.fileName+" (choose a file to replace)":"";$("m1").classList.add("on");$("fn").focus()}
$("add").onclick=()=>form();$("fx").onclick=()=>$("m1").classList.remove("on");
$("fs").onclick=async()=>{const name=$("fn").value.trim();if(!name){alert("Report name is required.");$("fn").focus();return}
 const f=$("ff").files[0],r=edit||{fav:false,fileName:"",file:null};
 Object.assign(r,{name,category:$("fc").value.trim()||DEF,desc:$("fd").value.trim(),type:$("fy").value,modified:Date.now()});
 if(f){r.fileName=f.name;r.file=new Blob([await f.arrayBuffer()],{type:f.type})}
 if(db){const id=await put(r);if(!edit)r.id=id}else if(!edit){r.id=mem.length+1;mem.push(r)}
 $("m1").classList.remove("on");await load()};
// view
async function view(id){const r=R.find(x=>x.id===id);if(!r)return;cur=r;
 $("vt").textContent=r.name;$("vi").textContent=[r.type,r.category,"Modified "+ago(r.modified),r.fileName?"File: "+r.fileName:"No file attached",r.desc].filter(Boolean).join("  ·  ");
 const p=$("vp");p.replaceChildren();p.style.display=r.file?"block":"none";$("vd").style.display=r.file?"":"none";$("m2").classList.add("on");
 if(!r.file)return;const n=r.fileName.toLowerCase();
 try{const buf=await r.file.arrayBuffer();let rows;
  if(/\.(xlsx|xls|csv)$/.test(n)&&window.XLSX){const wb=XLSX.read(buf,{type:"array"});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""})}
  else if(/\.(csv|txt|json)$/.test(n)){const t=new TextDecoder().decode(buf);if(n.endsWith(".csv"))rows=t.split(/\r?\n/).map(l=>l.split(","));else{const pre=mk("pre",0,t.slice(0,20000));p.append(pre);return}}
  else{p.append(mk("div","empty","Preview not available for this file type. Use Download."));return}
  const T=mk("table");rows.slice(0,200).forEach((row,i)=>{const tr=mk("tr");(row||[]).slice(0,40).forEach(c=>tr.append(mk(i?"td":"th",0,String(c))));T.append(tr)});p.append(T)
 }catch(e){p.append(mk("div","empty","Could not preview this file."))}}
$("vc").onclick=()=>$("m2").classList.remove("on");$("ve").onclick=()=>form(cur);$("vx").onclick=()=>rm(cur);$("vd").onclick=()=>dl(cur);
async function rm(r){if(!confirm('Delete "'+r.name+'"?'))return;await del(r.id);const i=mem.indexOf(r);if(i>-1)mem.splice(i,1);$("m2").classList.remove("on");await load()}
async function dl(r){if(!r.file){alert("This report has no file.");return}
 try{if(window.claude&&claude.use){const d=await claude.use("downloads");if(d){await d.save({filename:r.fileName,data:new Uint8Array(await r.file.arrayBuffer())});return}}}catch(e){if(e&&e.code==="declined")return}
 const u=URL.createObjectURL(r.file),a=document.createElement("a");a.href=u;a.download=r.fileName;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
// search / sidebar buttons
$("q").oninput=render;$("bq").onclick=()=>$("q").focus();
$("bf").onclick=()=>{onlyFav=!onlyFav;render()};$("bc").onclick=()=>{onlyFav=false;$("q").value="";render()};
$("ea").onchange=e=>{R.forEach(r=>sideOpen[r.category]=e.target.checked);render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".mask").forEach(m=>m.classList.remove("on"))});
(async()=>{await open();await seed();await load()})();
</script></body></html>
